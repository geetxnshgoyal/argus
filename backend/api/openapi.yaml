          minLength: 3
        confirm:
          type: boolean
          description: Required when the class already has attendance
    CalendarDay:
      type: object
      required:
      - term_id
      - date
      - kind
      - note
      properties:
        term_id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        kind:
          type: string
          enum:
          - holiday
          - exam
          - no_classes
          - working
        follows_weekday:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 7
        note:
          type: string
        created_at:
          type: string
          format: date-time
    CalendarDayInput:
      type: object
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - holiday
          - exam
          - no_classes
          - working
        follows_weekday:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 7
        note:
          type: string
    TimetableImportRow:
      type: object
      required:
      - day
      - start
      - end
      - subject_code
      properties:
        ref:
          type: string
        day:
          type: integer
          minimum: 1
          maximum: 7
        start:
          type: string
          pattern: ^\d{1,2}:\d{2}$
          example: 09:30
        end:
          type: string
          pattern: ^\d{1,2}:\d{2}$
          example: 09:30
        subject_code:
          type: string
        subject_kind:
          type: string
          enum:
          - lecture
          - lab
          - tutorial
        batch:
          type:
          - string
          - 'null'
        room:
          type:
          - string
          - 'null'
        teacher_email:
          type:
          - string
          - 'null'
          format: email
    TimetableImportRequest:
      type: object
      required:
      - term_id
      - section_id
      properties:
        term_id:
          type: string
          format: uuid
        section_id:
          type: string
          format: uuid
        effective_from:
          type: string
          format: date
        xlsx_base64:
          type: string
          description: The timetable sheet downloaded as .xlsx, base64
        rows:
          type: array
          items:
            $ref: '#/components/schemas/TimetableImportRow'
    TimetableImportReport:
      type: object
      required:
      - dry_run
      - effective_from
      - summary
      - create
      - issues
      - classes
      - teacherless
      properties:
        dry_run:
          type: boolean
        effective_from:
          type: string
          format: date
        summary:
          type: object
          required:
          - classes
          - new
          - unchanged
          - ended
          - sessions_scheduled
          - errors
          - warnings
          properties:
            classes:
              type: integer
            new:
              type: integer
            unchanged:
              type: integer
            ended:
              type: integer
            sessions_scheduled:
              type: integer
            errors:
              type: integer
            warnings:
              type: integer
        create:
          type: object
          required:
          - subjects
          - rooms
          - batches
          - offerings
          properties:
            subjects:
              type: array
              items:
                type: object
                required:
                - code
                - kind
                properties:
                  code:
                    type: string
                  kind:
                    type: string
            rooms:
              type: array
              items:
                type: string
            batches:
              type: array
              items:
                type: string
            offerings:
              type: array
              items:
                type: string
        issues:
          type: array
          items:
            type: object
            required:
            - ref
            - level
            - message
            properties:
              ref:
                type: string
              level:
                type: string
                enum:
                - error
                - warning
              message:
                type: string
        classes:
          type: array
          items:
            type: object
            required:
            - ref
            - day
            - start
            - end
            - subject
            - batch
            - room
            - status
            properties:
              ref:
                type: string
              day:
                type: string
              start:
                type: string
              end:
                type: string
              subject:
                type: string
              batch:
                type:
                - string
                - 'null'
              room:
                type:
                - string
                - 'null'
              status:
                type: string
                enum:
                - new
                - unchanged
        teacherless:
          type: array
          items:
            type: string
    Conflicts:
      type: object
      required:
      - conflicts
      - warnings
      properties:
        conflicts:
          type: array
          items:
            type: object
            required:
            - kind
            - message
            properties:
              kind:
                type: string
                enum:
                - conflict
              message:
                type: string
        warnings:
          type: array
          items:
            type: object
            required:
            - kind
            - message
            properties:
              kind:
                type: string
                enum:
                - warning
              message:
                type: string
    ClassSession:
      type: object
      required:
      - id
      - date
      - start
      - end
      - starts_at
      - ends_at
      - status
      - changed
      - subject
      - section
      - batch
      - room
      - teacher
      - entry_id
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        start:
          type: string
          example: 09:30
        end:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - scheduled
          - in_progress
          - completed
          - cancelled
        changed:
          type: boolean
          description: Changed for this date by Acad Ops
        subject:
          type: object
          required:
          - code
          - name
          - kind
          properties:
            code:
              type: string
            name:
              type: string
            kind:
              type: string
        section:
          type: object
          required:
          - id
          - name
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        batch:
          type:
          - string
          - 'null'
        room:
          type:
          - string
          - 'null'
        teacher:
          type:
          - string
          - 'null'
        expected:
          type: integer
          description: Students expected (teacher views)
        entry_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Weekly entry this class comes from (null for one-off classes)
    ClassSessionList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClassSession'
    ClassSessionRange:
      type: object
      required:
      - from
      - to
      - items
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClassSession'
    TeacherToday:
      type: object
      required:
      - date
      - items
      properties:
        date:
          type: string
          format: date
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClassSession'
    SyncResult:
      type: object
      required:
      - added
      - removed
      - updated
      properties:
        added:
          type: integer
        removed:
          type: integer
        updated:
          type: integer
    MaterializeResult:
      type: object
      required:
      - sections
      - failed
      properties:
        sections:
          type: integer
        failed:
          type: array
          items:
            type: object
            required:
            - sectionId
            - error
            properties:
              sectionId:
                type: string
              error:
                type: string
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Q:
      name: q
      in: query
      schema:
        type: string
        maxLength: 100
      description: Case-insensitive search
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 200
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    DryRun:
      name: dry_run
      in: query
      schema:
        type: string
        enum:
        - 'true'
        - 'false'
        default: 'true'
      description: true (default) only reports what would change
  responses:
    Error400:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error401:
      description: Not signed in
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error403:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error404:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error409:
      description: Conflict (duplicate, in use, or overlapping)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: argus_sid
      description: Staff web session (cookie is __Host-argus_sid over https). Mutating requests also need the x-argus-csrf
        header.
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Student app access token (15 min).
security:
- session: []
- bearer: []
