openapi: 3.1.0
info:
  title: Argus API
  version: 0.1.0
  description: |
    Argus attendance API. This file is the source of truth: server and web types are generated
    from it (`pnpm gen:api`), and a backend test fails if any /v1 route is missing here or vice versa.

    Errors always use the Error schema. Server time is authoritative.
  license:
    name: Proprietary
servers:
- url: /
tags:
- name: system
- name: auth
- name: me
- name: admin
- name: audit
- name: dev
- name: timetable
- name: teacher
- name: student
paths:
  /v1/health:
    get:
      tags:
      - system
      operationId: getHealth
      summary: Liveness and dependency health
      security: []
      responses:
        '200':
          description: Server and database are healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: A dependency (the database) is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /v1/time:
    get:
      tags:
      - system
      operationId: getTime
      summary: Server time, used by clients to compute their clock offset
      security: []
      responses:
        '200':
          description: Current server time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerTime'
  /v1/admin/departments:
