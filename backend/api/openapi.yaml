  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Q:
      name: q
      in: query
      schema:
        type: string
        maxLength: 100
      description: Case-insensitive search
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 200
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    DryRun:
      name: dry_run
      in: query
      schema:
        type: string
        enum:
        - 'true'
        - 'false'
        default: 'true'
      description: true (default) only reports what would change
  responses:
    Error422:
      description: Rejected (reason in `code`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error429:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error503:
      description: A provider (e.g. Google/Apple attestation) is unavailable; try again
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error400:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error401:
      description: Not signed in
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error403:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error404:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error409:
      description: Conflict (duplicate, in use, or overlapping)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: argus_sid
      description: Staff web session (cookie is __Host-argus_sid over https). Mutating requests also need the x-argus-csrf
        header.
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Student app access token (15 min).
security:
- session: []
- bearer: []
