  /v1/auth/oidc/login:
    get:
      tags:
      - auth
      operationId: ssoLogin
      security: []
      summary: Start college SSO (redirects to Google)
      parameters:
      - name: client
        in: query
        schema:
          type: string
          enum:
          - web
          - mobile
          default: web
      - name: next
        in: query
        schema:
          type: string
        description: Same-site path to return to (web)
      - name: app_challenge
        in: query
        schema:
          type: string
        description: 'Mobile: S256 PKCE challenge of the app verifier'
      - name: reauth
        in: query
        schema:
          type: string
          enum:
          - '1'
          - 'true'
        description: Force a fresh sign-in (sensitive actions)
      responses:
        '302':
          description: Redirect
        '503':
          description: SSO not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/auth/oidc/callback:
    get:
      tags:
      - auth
      operationId: ssoCallback
      security: []
      summary: 'IdP redirect target. Web: sets the session cookie; mobile: redirects to the app with a one-time
        code'
      parameters:
      - name: code
        in: query
        schema:
          type: string
      - name: state
        in: query
        schema:
          type: string
      responses:
        '302':
          description: Redirect
  /v1/auth/mobile/exchange:
    post:
      tags:
      - auth
      operationId: mobileExchange
      security: []
      summary: Redeem the one-time code; binds tokens to the device session key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              - code_verifier
              - session_public_key
              - signature
              properties:
                code:
                  type: string
                code_verifier:
                  type: string
                session_public_key:
                  type: string
                  pattern: ^[A-Za-z0-9_-]+$
                  description: P-256 SPKI DER, base64url
                signature:
                  type: string
                  pattern: ^[A-Za-z0-9_-]+$
                  description: ECDSA-SHA256 over "argus/v1/exchange|<code>"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
  /v1/auth/refresh:
    post:
      tags:
      - auth
      operationId: refreshTokens
      security: []
      summary: Rotate tokens; signed by the device session key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - refresh_token
              - ts
              - signature
              properties:
                refresh_token:
                  type: string
                ts:
                  type: integer
                  description: Device time, ms
                signature:
                  type: string
                  pattern: ^[A-Za-z0-9_-]+$
                  description: ECDSA-SHA256 over "argus/v1/refresh|<token>|<ts>"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
