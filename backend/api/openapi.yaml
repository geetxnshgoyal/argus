openapi: 3.1.0
info:
  title: Argus API
  version: 0.1.0
  description: |
    Argus attendance API. This file is the source of truth: server and web
    types are generated from it (`pnpm gen:api`), and a backend test fails if
    any /v1 route is missing here or vice versa.

    Errors always use the Error schema. Server time is authoritative.
servers:
  - url: /
tags:
  - name: system
paths:
  /v1/health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness and dependency health
      security: []
      responses:
        '200':
          description: Server and database are healthy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: A dependency (the database) is unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /v1/time:
    get:
      tags: [system]
      operationId: getTime
      summary: Server time, used by clients to compute their clock offset
      security: []
      responses:
        '200':
          description: Current server time
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerTime' }
components:
  schemas:
    Error:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code: { type: string, description: Stable machine-readable error code }
        message: { type: string, description: Human-readable, safe to display }
        details: { type: object, additionalProperties: true }
    Health:
      type: object
      required: [status, version, db]
      additionalProperties: false
      properties:
        status: { type: string, enum: [ok, degraded] }
        version: { type: string }
        db: { type: string, enum: [ok, unavailable] }
    ServerTime:
      type: object
      required: [server_time_ms, server_time]
      additionalProperties: false
      properties:
        server_time_ms: { type: integer, format: int64, description: Unix epoch milliseconds }
        server_time: { type: string, format: date-time }
