components:
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      additionalProperties: false
      properties:
        code:
          type: string
          description: Stable machine-readable error code
        message:
          type: string
          description: Human-readable; safe to display
        details:
          type: object
          additionalProperties: true
    Health:
      type: object
      required:
      - status
      - version
      - db
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
        version:
          type: string
        db:
          type: string
          enum:
          - ok
          - unavailable
    ServerTime:
      type: object
      required:
      - server_time_ms
      - server_time
      additionalProperties: false
      properties:
        server_time_ms:
          type: integer
          format: int64
          description: Unix epoch milliseconds
        server_time:
          type: string
          format: date-time
    Department:
      allOf:
      - type: object
        required:
        - id
        - created_at
        - updated_at
        properties:
          id:
            type: string
            format: uuid
          created_at:
            type: string
            format: date-time
          updated_at:
            type: string
            format: date-time
      - type: object
        properties:
          code:
            type: string
          name:
            type: string
    DepartmentInput:
      type: object
      required:
      - code
      - name
      properties:
        code:
          type: string
        name:
          type: string
    DepartmentPatch:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
    DepartmentList:
      type: object
      required:
      - items
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Department'
        total:
          type: integer
    Program:
      allOf:
      - type: object
        required:
        - id
        - created_at
        - updated_at
        properties:
          id:
            type: string
            format: uuid
          created_at:
            type: string
            format: date-time
          updated_at:
            type: string
            format: date-time
      - type: object
        properties:
          code:
            type: string
          name:
            type: string
          department_id:
            type: string
            format: uuid
    ProgramInput:
      type: object
      required:
      - code
      - name
      - department_id
      properties:
        code:
          type: string
        name:
          type: string
        department_id:
          type: string
          format: uuid
    ProgramPatch:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        department_id:
          type: string
          format: uuid
    ProgramList:
      type: object
      required:
      - items
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Program'
        total:
          type: integer
    Term:
      allOf:
      - type: object
        required:
        - id
        - created_at
        - updated_at
        properties:
          id:
            type: string
            format: uuid
          created_at:
            type: string
            format: date-time
          updated_at:
            type: string
            format: date-time
      - type: object
        properties:
          name:
            type: string
          start_date:
            type: string
            format: date
          end_date:
            type: string
            format: date
    TermInput:
      type: object
      required:
      - name
      - start_date
      - end_date
      properties:
        name:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
    TermPatch:
      type: object
      properties:
        name:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
    TermList:
      type: object
      required:
      - items
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Term'
        total:
          type: integer
    Section:
      allOf:
      - type: object
        required:
        - id
        - created_at
        - updated_at
        properties:
          id:
            type: string
            format: uuid
          created_at:
            type: string
            format: date-time
          updated_at:
            type: string
            format: date-time
      - type: object
