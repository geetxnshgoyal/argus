name: Android APK

# Builds the release APK for the hosted server and attaches it to a GitHub Release.
#  - Push a tag like v1.2.0            -> release "v1.2.0"
#  - Run manually (Actions tab)        -> pre-release "pilot" (replaced each time)
# Needs repository secrets ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD and the variable ARGUS_PUBLIC_URL.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Release signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Add the ANDROID_KEYSTORE_* repository secrets (deploy/README.md)"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > android/argus-release.jks
          printf 'storeFile=argus-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
      - name: Server address
        run: |
          if [ -z "${{ vars.ARGUS_PUBLIC_URL }}" ]; then echo "::error::Set the repository variable ARGUS_PUBLIC_URL"; exit 1; fi
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=ARGUS_API=${{ vars.ARGUS_PUBLIC_URL }} --dart-define=ARGUS_APP_VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('pilot-{0}', github.run_number) }} --build-number=${{ github.run_number }}
      - name: Name the APK and show its signing certificate
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk argus.apk
          echo "Server setting ANDROID_SIGNING_CERT_SHA256 must be:"
          "$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner" verify --print-certs argus.apk | grep 'SHA-256 digest' | head -1
      - uses: actions/upload-artifact@v4
        with:
          name: argus-apk
          path: app/argus.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            gh release create "${{ github.ref_name }}" argus.apk --title "Argus ${{ github.ref_name }}" --notes "Android app for ${{ vars.ARGUS_PUBLIC_URL }}. Install on your own phone; register it once."
          else
            gh release delete pilot --yes --cleanup-tag || true
            gh release create pilot argus.apk --prerelease --target "${{ github.sha }}" --title "Argus pilot build ${{ github.run_number }}" --notes "Pilot build of ${{ github.sha }} for ${{ vars.ARGUS_PUBLIC_URL }}."
          fi
